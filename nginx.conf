# Docker's embedded DNS. A plain `proxy_pass http://app:3000` resolves once
# at startup and never again, so if the app container is later recreated
# (new IP) nginx keeps proxying to the stale address - using a variable here
# forces per-request re-resolution instead.
resolver 127.0.0.11 valid=10s;

server {
  listen 80;
  server_name govuk-preview-app.dev.gov.uk *.govuk-preview-app.dev.gov.uk;

  set $upstream_app app:3000;

  location / {
    proxy_pass http://$upstream_app;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
