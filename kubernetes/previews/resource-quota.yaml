# The hard cap on what previews can use between them - once reached, new
# preview pods are refused rather than scaling the cluster up indefinitely,
# and PreviewCapacity puts the least recently used previews to sleep to
# make room. With the per-app memory settings in config/govuk_apps.yml, a
# Whitehall stack requests about 1.5Gi (core) or 2.2Gi (full) - so this
# holds roughly 10 full or 16 core Whitehall stacks awake at once.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: previews
spec:
  hard:
    requests.memory: 24Gi
    limits.memory: 64Gi
    requests.storage: 60Gi
    persistentvolumeclaims: "60"
    pods: "150"
---
# Defaults for anything that doesn't set its own (a ResourceQuota on
# memory makes every pod declare requests/limits, or be rejected).
apiVersion: v1
kind: LimitRange
metadata:
  name: previews
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: 50m
        memory: 256Mi
      default:
        memory: 1Gi
