# The whole local setup, applied by bin/kind-deploy: the same previews
# namespace objects integration uses (../previews), plus Preview App itself
# and its own Postgres/Redis in the `apps` namespace - the same layout as
# integration, where Preview App is a normal app in `apps`.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespaces.yaml
  - ../previews
  - preview-app.yaml
  - postgres.yaml
  - redis.yaml
  - metrics-server.yaml
patches:
  # One kind node can't hold what integration's quota allows - set the
  # quota to what it can, so PreviewCapacity puts previews to sleep before
  # the node runs out of memory. ~7.75Gi allocatable, less ~0.3Gi for
  # Kubernetes' own pods: room for one full Whitehall stack and a build
  # alongside other small previews, but not two Whitehall stacks at once.
  # (Limits can safely overcommit - only requests decide scheduling.)
  - target:
      kind: ResourceQuota
      name: previews
    patch: |-
      - op: replace
        path: /spec/hard/requests.memory
        value: 7Gi
